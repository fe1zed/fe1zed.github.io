<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — fe1zed</title>
  <meta name="description" content="Get in touch with fe1zed.">
  <meta property="og:title" content="Contact — fe1zed">
  <meta property="og:description" content="Have a question about one of my assets, found a bug, or want to suggest a feature? Get in touch.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://fe1zed.github.io/contact.html">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Contact — fe1zed">
  <meta name="twitter:description" content="Have a question about one of my assets, found a bug, or want to suggest a feature? Get in touch.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/contact.css">

  <script type="module" src="js/pages/contact.js"></script>
</head>
<body>
  <site-nav></site-nav>

  <div class="contact-sky">
    <canvas class="contact-planes" id="contact-planes" aria-hidden="true"></canvas>
    <canvas class="contact-planes contact-planes--front" id="contact-launch" aria-hidden="true"></canvas>

    <main class="page page--contact">
      <div class="contact-wrap">
        <div class="contact-intro">
          <h1 class="contact-heading"><span class="contact-backing">Get in touch</span></h1>
          <p class="contact-text">
            <span class="contact-backing">Have a question about one of my assets, found a bug, or want to suggest a feature?
            I read every message and try to reply within a couple of days.</span>
          </p>
        </div>

        <form class="form contact-form" id="contact-form" action="https://formspree.io/f/mbdwrajl" method="POST">
          <div class="form-group">
            <label class="form-label form-label--caps" for="name"><span class="contact-backing">Name</span></label>
            <input class="form-input" type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required>
          </div>
          <div class="form-group">
            <label class="form-label form-label--caps" for="email"><span class="contact-backing">Email</span></label>
            <input class="form-input" type="email" id="email" name="email" placeholder="your@email.com" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label class="form-label form-label--caps" for="subject"><span class="contact-backing">Subject</span></label>
            <input class="form-input" type="text" id="subject" name="subject" placeholder="Bug report, question, feedback…">
          </div>
          <div class="form-group">
            <label class="form-label form-label--caps" for="message"><span class="contact-backing">Message</span></label>
            <textarea class="form-input form-textarea" id="message" name="message" rows="5" placeholder="Write your message here…" required></textarea>
          </div>
          <button class="btn btn--primary btn--sm send-btn" type="submit" data-state="idle">
            <span class="send-btn-labels">
              <span data-label="idle">Send message</span>
              <span data-label="sending">Sending…</span>
              <span data-label="sent">Sent</span>
              <span data-label="failed">Failed</span>
            </span>
            <span class="send-btn-icon"></span>
          </button>
          <p class="visually-hidden" id="form-status" role="status"></p>
          <p class="visually-hidden" id="form-error" role="alert"></p>
        </form>
      </div>
    </main>
  </div>

  <site-footer></site-footer>
</body>
</html>
